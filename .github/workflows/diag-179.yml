# TEMPORARY: measurements for issue #179, removed before the PR is final.
name: Diag 179

on:
  push:
    branches: [fix/docker-exec-close]
    paths: ['.github/workflows/diag-179.yml', 'tests/docker_exec_diag.rs', 'tests/docker_exec.rs', 'src/docker/exec.rs']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  diag:
    name: ${{ matrix.name }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: stubborn, mode: stubborn }
          - { name: old-close, mode: old }
    steps:
      - uses: actions/checkout@v7
      # The new tests against the close shipped in main (the app-exit test needs the new API,
      # so it is cut out, and the UI files that call the new API are taken from main too).
      - name: Old close
        if: matrix.mode == 'old'
        run: |
          git fetch --depth 1 origin main
          awk '/^\/\/\/ The app-exit path/{skip=1} /^\/\/\/ Waits up to 10 seconds/{skip=0} !skip' tests/docker_exec.rs > "$RUNNER_TEMP/docker_exec.rs"
          git checkout FETCH_HEAD -- .
          rm -f tests/docker_exec_diag.rs
          cp "$RUNNER_TEMP/docker_exec.rs" tests/docker_exec.rs
          git diff --stat
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-x86_64
          save-if: false
      - name: Build tests
        run: |
          cargo test --locked --test docker_exec $( [ -f tests/docker_exec_diag.rs ] && echo --test docker_exec_diag ) --test docker_files --no-run --message-format=json > build.json || { jq -r 'select(.reason == "compiler-message") | .message.rendered' build.json; exit 1; }
          for t in docker_exec docker_exec_diag docker_files; do
            echo "BIN_$t=$(jq -r --arg t $t 'select(.profile.test == true and .target.name == $t) | .executable' build.json)" >> "$GITHUB_ENV"
          done
      - name: New tests on the old close
        if: matrix.mode == 'old'
        run: |
          "$BIN_docker_exec" clos --test-threads 1 --nocapture 2>&1 | grep -vE '^\s*$' || true
      - name: Stubborn scenario
        if: matrix.mode == 'stubborn'
        run: |
          docker version --format 'server {{.Server.Version}}'
          for m in product traced init leaf orphan; do
            DIAG_STUBBORN=$m DIAG_ITERS=10 "$BIN_docker_exec_diag" diag_stubborn --nocapture 2>&1 | grep --line-buffered -E '^DIAG|panicked' || true
          done
          docker ps -a --filter name=tmop-test- --format '{{.Names}}' | xargs -r docker rm -f
