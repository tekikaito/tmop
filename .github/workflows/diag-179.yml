# TEMPORARY: measurements for issue #179, removed before the PR is final.
name: Diag 179

on:
  push:
    branches: [fix/docker-exec-close]
    paths: ['.github/workflows/diag-179.yml', 'tests/docker_exec_diag.rs', 'tests/docker_exec.rs', 'src/docker/exec.rs']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  diag:
    name: ${{ matrix.name }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: loop-test
            mode: loop
            load: 'no'
          - name: loop-test-load
            mode: loop
            load: 'yes'
          - name: diag-product
            mode: diag
            variants: 'product:300:1 product:300:4'
          - name: diag-raw
            mode: diag
            variants: 'drop:20:1 ctrl_d:200:1 ctrl_c_d:300:1 ctrl_c_wait_d:300:1 ctrl_c_d:300:4'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-x86_64
          save-if: false
      - name: Build tests
        run: cargo test --locked --test docker_exec --test docker_exec_diag --test docker_containers --test docker_files --no-run
      - name: Loop the real test
        if: matrix.mode == 'loop'
        run: |
          bin=$(ls -t target/debug/deps/docker_exec-* | grep -v '\.d$' | head -1)
          if [ "${{ matrix.load }}" = yes ]; then
            for _ in $(seq $(nproc)); do (while :; do :; done) & done
          fi
          fail=0
          for i in $(seq 300); do
            if [ "${{ matrix.load }}" = yes ]; then
              # The whole docker_exec suite in parallel, as in CI, on a busy machine.
              out=$("$bin" --test-threads 8 2>&1) || { fail=$((fail+1)); echo "FAIL run $i"; echo "$out" | grep -A12 'stdout ----'; }
            else
              out=$("$bin" closing_the_session_ends_the_shell --exact 2>&1) || { fail=$((fail+1)); echo "FAIL run $i"; echo "$out" | grep -A12 'stdout ----'; }
            fi
          done
          echo "LOOP SUMMARY load=${{ matrix.load }} runs=300 failures=$fail"
          docker ps -a --filter name=tmop-test- --format '{{.Names}}' | xargs -r docker rm -f
      - name: Diagnostics
        if: matrix.mode == 'diag'
        run: |
          bin=$(ls -t target/debug/deps/docker_exec_diag-* | grep -v '\.d$' | head -1)
          for spec in ${{ matrix.variants }}; do
            IFS=: read -r v n t <<< "$spec"
            if [ "$t" != 1 ]; then
              for _ in $(seq $(nproc)); do (while :; do :; done) & done
            fi
            DIAG_VARIANT=$v DIAG_ITERS=$n DIAG_THREADS=$t "$bin" --nocapture 2>&1 | grep '^DIAG' || true
            jobs -p | xargs -r kill || true
          done
          docker ps -a --filter name=tmop-test- --format '{{.Names}}' | xargs -r docker rm -f
