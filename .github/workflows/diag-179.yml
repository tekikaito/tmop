# TEMPORARY: measurements for issue #179, removed before the PR is final.
name: Diag 179

on:
  push:
    branches: [fix/docker-exec-close]
    paths: ['.github/workflows/diag-179.yml', 'tests/docker_exec_diag.rs', 'tests/docker_exec.rs', 'src/docker/exec.rs']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  diag:
    name: ${{ matrix.name }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: loop-test
            mode: loop
            load: 'no'
          - name: loop-test-load
            mode: loop
            load: 'yes'
          - { name: diag-product-1, mode: diag, variants: 'product:300:1' }
          - { name: diag-product-4, mode: diag, variants: 'product:300:4' }
          - { name: diag-drop-ctrl-d, mode: diag, variants: 'drop:20:1 ctrl_d:100:1' }
          - { name: diag-ctrl-c-d, mode: diag, variants: 'ctrl_c_d:300:1' }
          - { name: diag-ctrl-c-d-4, mode: diag, variants: 'ctrl_c_d:300:4' }
          - { name: diag-ctrl-c-wait-d, mode: diag, variants: 'ctrl_c_wait_d:300:1' }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-x86_64
          save-if: false
      - name: Build tests
        run: |
          cargo test --locked --test docker_exec --test docker_exec_diag --test docker_files --test docker_logs --no-run --message-format=json > build.json
          for t in docker_exec docker_exec_diag docker_files; do
            echo "BIN_$t=$(jq -r --arg t $t 'select(.profile.test == true and .target.name == $t) | .executable' build.json)" >> "$GITHUB_ENV"
          done
          cat "$GITHUB_ENV"
      - name: Loop the real test
        if: matrix.mode == 'loop'
        run: |
          bin=$BIN_docker_exec
          if [ "${{ matrix.load }}" = yes ]; then
            for _ in $(seq $(nproc)); do (while :; do :; done) & done
            other=$BIN_docker_files
            (while :; do "$other" >/dev/null 2>&1; done) &
          fi
          fail=0
          for i in $(seq 300); do
            if [ "${{ matrix.load }}" = yes ]; then
              # The whole docker_exec suite in parallel, as in CI, on a busy machine.
              out=$("$bin" --test-threads 8 2>&1) || { fail=$((fail+1)); echo "FAIL run $i"; echo "$out" | grep -A12 'stdout ----'; }
            else
              out=$("$bin" closing_the_session_ends_the_shell --exact 2>&1) || { fail=$((fail+1)); echo "FAIL run $i"; echo "$out" | grep -A12 'stdout ----'; }
            fi
          done
          echo "LOOP SUMMARY load=${{ matrix.load }} runs=300 failures=$fail"
          docker ps -a --filter name=tmop-test- --format '{{.Names}}' | xargs -r docker rm -f
      - name: Diagnostics
        if: matrix.mode == 'diag'
        run: |
          bin=$BIN_docker_exec_diag
          for spec in ${{ matrix.variants }}; do
            IFS=: read -r v n t <<< "$spec"
            if [ "$t" != 1 ]; then
              for _ in $(seq $(nproc)); do (while :; do :; done) & done
            fi
            DIAG_VARIANT=$v DIAG_ITERS=$n DIAG_THREADS=$t timeout 1500 "$bin" --nocapture 2>&1 | grep --line-buffered '^DIAG' || true
            jobs -p | xargs -r kill || true
          done
          docker ps -a --filter name=tmop-test- --format '{{.Names}}' | xargs -r docker rm -f
