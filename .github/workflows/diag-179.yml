# TEMPORARY: measurements for issue #179, removed before the PR is final.
name: Diag 179

on:
  push:
    branches: [fix/docker-exec-close]
    paths: ['.github/workflows/diag-179.yml', 'tests/docker_exec_diag.rs', 'tests/docker_exec.rs', 'src/docker/exec.rs']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  diag:
    name: ${{ matrix.name }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: loop-test, mode: loop, load: 'no' }
          - { name: loop-test-load, mode: loop, load: 'yes' }
          - { name: stubborn, mode: stubborn }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-x86_64
          save-if: false
      - name: Build tests
        run: |
          cargo test --locked --test docker_exec --test docker_exec_diag --test docker_files --no-run --message-format=json > build.json || { jq -r 'select(.reason == "compiler-message") | .message.rendered' build.json; exit 1; }
          for t in docker_exec docker_exec_diag docker_files; do
            echo "BIN_$t=$(jq -r --arg t $t 'select(.profile.test == true and .target.name == $t) | .executable' build.json)" >> "$GITHUB_ENV"
          done
      # The closing tests alone (no load), or the whole docker_exec suite on 8 threads with
      # every core busy and the docker_files suite looping beside it. Fails on any failure.
      - name: Loop the tests
        if: matrix.mode == 'loop'
        run: |
          bin=$BIN_docker_exec
          if [ "${{ matrix.load }}" = yes ]; then
            for _ in $(seq $(nproc)); do (while :; do :; done) & done
            other=$BIN_docker_files
            (while :; do "$other" >/dev/null 2>&1; done) &
          fi
          fail=0
          for i in $(seq 300); do
            if [ "${{ matrix.load }}" = yes ]; then
              out=$("$bin" --test-threads 8 2>&1) || { fail=$((fail+1)); echo "FAIL run $i"; echo "$out" | grep -A14 'stdout ----'; }
            else
              out=$("$bin" clos 2>&1) || { fail=$((fail+1)); echo "FAIL run $i"; echo "$out" | grep -A14 'stdout ----'; }
            fi
          done
          echo "$out" | grep '^test ' | sort
          echo "LOOP SUMMARY load=${{ matrix.load }} runs=300 failures=$fail"
          docker ps -a --filter name=tmop-test- --format '{{.Names}}' | xargs -r docker rm -f
          [ "$fail" -eq 0 ]
      - name: Stubborn scenario
        if: matrix.mode == 'stubborn'
        run: |
          for m in product traced init; do
            DIAG_STUBBORN=$m DIAG_ITERS=50 "$BIN_docker_exec_diag" diag_stubborn --nocapture 2>&1 | grep --line-buffered -E '^DIAG SUMMARY|trace|panicked' || true
          done
          docker ps -a --filter name=tmop-test- --format '{{.Names}}' | xargs -r docker rm -f
