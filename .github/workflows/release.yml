name: Release

# Push a tag like v0.2.0 (matching `version` in Cargo.toml) to build and publish a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: windows-x64
            target: x86_64-pc-windows-msvc
            test: true
          - name: windows-arm64
            target: aarch64-pc-windows-msvc
            test: false
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches Cargo.toml version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} does not match Cargo.toml version $version"
            exit 1
          }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Test
        if: matrix.test
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package
        shell: pwsh
        run: |
          $name = "TMOP-${{ github.ref_name }}-${{ matrix.name }}"
          $dir = "dist\$name"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\TMOP.exe" $dir
          Copy-Item README.md, LICENSE, assets\fonts\Michroma-OFL.txt $dir
          Compress-Archive -Path "$dir\*" -DestinationPath "dist\$name.zip"
          $hash = (Get-FileHash "dist\$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "dist\$name.zip.sha256"
          # The bare exe under a version-less name, so the website and install.ps1 can link to
          # releases/latest/download/TMOP-windows-<arch>.exe without knowing the version.
          $exe = "TMOP-${{ matrix.name }}.exe"
          Copy-Item "target\${{ matrix.target }}\release\TMOP.exe" "dist\$exe"
          $hash = (Get-FileHash "dist\$exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  $exe" | Out-File -Encoding ascii "dist\$exe.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*.exe
            dist/*.exe.sha256
          if-no-files-found: error

  engine:
    name: Build engine ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Check init script syntax
        run: sh -n engine/rootfs/usr/local/bin/tmop-engine

      - name: Build rootfs
        run: engine/build.sh ${{ github.ref_name }} ${{ matrix.arch }} dist

      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.arch }}
          path: dist/tmop-engine-*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [build, engine]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "TMOP ${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag
