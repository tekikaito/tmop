name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Build, test and lint (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            test: true
          - target: aarch64-pc-windows-msvc
            test: false
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --target ${{ matrix.target }}

      - name: Test
        if: matrix.test
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Clippy
        run: |
          cargo clippy --locked --target ${{ matrix.target }} --all-targets -- -D warnings
          cargo clippy --locked --target ${{ matrix.target }} --all-targets --features screensaver -- -D warnings

  docker-linux:
    name: Docker integration tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-docker

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev libasound2-dev

      - name: Docker info
        run: |
          docker version
          docker info --format '{{.ServerVersion}}'

      # The full suite runs in the Windows jobs; here only the tests that need a Docker engine.
      - name: Test
        run: cargo test --locked --test docker_exec --test docker_files --test docker_logs --test docker_run

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
