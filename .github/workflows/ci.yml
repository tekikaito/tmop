name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Build, test and lint (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            test: true
          - target: aarch64-pc-windows-msvc
            test: false
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --target ${{ matrix.target }}

      - name: Test
        if: matrix.test
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Clippy
        run: |
          cargo clippy --locked --target ${{ matrix.target }} --all-targets -- -D warnings
          cargo clippy --locked --target ${{ matrix.target }} --all-targets --features screensaver -- -D warnings

  # Built on 22.04 for the glibc 2.35 floor of the Linux release. The GUI stack (winit, glutin,
  # xkbcommon) loads X11, Wayland and GL with dlopen and rfd talks to the XDG portal over D-Bus
  # in pure Rust, so building needs no -dev packages.
  linux:
    name: Build, test and lint (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-x86_64

      - name: Build
        run: cargo build --locked

      - name: Docker info
        run: |
          docker version
          docker info --format '{{.ServerVersion}}'

      # The full suite, including the docker_* integration tests against the runner's engine.
      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  linux-arm64:
    name: Build and test (aarch64-unknown-linux-gnu)
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-aarch64

      - name: Build
        run: cargo build --locked

      # The Docker suites run in the x86_64 job only.
      - name: Test
        run: cargo test --locked --lib --bins

  macos:
    name: Build, test and lint (macOS)
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos

      - name: Build (aarch64)
        run: cargo build --locked --target aarch64-apple-darwin

      # The runner has no Docker engine; the docker_* suites run in the Linux job.
      - name: Test (aarch64)
        run: cargo test --locked --target aarch64-apple-darwin --lib --bins

      - name: Clippy (aarch64)
        run: cargo clippy --locked --target aarch64-apple-darwin --all-targets -- -D warnings

      - name: Build (x86_64)
        run: cargo build --locked --target x86_64-apple-darwin
