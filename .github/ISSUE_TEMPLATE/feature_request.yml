name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: Describe the problem or the goal, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like TMOP to do?
  - type: dropdown
    id: os
    attributes:
      label: Which systems is this for?
      multiple: true
      options: [Windows, Linux, macOS]
