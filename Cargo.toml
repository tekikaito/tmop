[package]
name = "tmop"
version = "0.1.0"
edition = "2021"
description = "TMOP (Task Manager OverPowered): a skinnable Windows system monitor in Rust, compatible with TMOG skins and settings"
publish = false
license = "GPL-3.0-only"
repository = "https://github.com/tekikaito/tmop"

[lib]
name = "tmop"
path = "src/lib.rs"

[[bin]]
name = "TMOP"
path = "src/main.rs"

[features]
default = []
# Enables Windows screensaver argument handling (/s, /p <hwnd>, /c).
screensaver = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "glow"] }
egui_extras = { version = "0.29.1", default-features = false }
png = "0.18"
bollard = "0.21.1"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "sync", "time", "io-util", "macros", "process"] }
futures-util = "0.3.34"
tar = "0.4.46"
bytes = "1.12.1"
alacritty_terminal = { version = "0.26.0", default-features = false }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal", "pollster", "common-controls-v6"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.58.0"
features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
    "Win32_System_Services",
    "Win32_System_Com",
    "Win32_Graphics_Gdi",
    "Data_Xml_Dom",
    "UI_Notifications",
]

[dev-dependencies]

[profile.release]
opt-level = 3
lto = "thin"
