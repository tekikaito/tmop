# nfpm config for the .deb and .rpm (packaging/linux/package.sh). Environment, set by the script:
#   NFPM_ARCH     amd64 or arm64 (nfpm translates it to x86_64 / aarch64 for the rpm)
#   NFPM_VERSION  the release version without the v
#   TMOP_BINARY   the built binary
#   TMOP_ROOT     the repository root
# (contents entries need expand: true for nfpm to substitute them.)
#
# Runtime libraries: the binary links only libc, libm and libgcc_s. The GUI stack (winit, glutin,
# xkbcommon) loads X11, Wayland, EGL and GL with dlopen at start, and a missing one stops TMOP,
# so they are real dependencies. The debs name Debian/Ubuntu packages; the rpms name sonames
# (libX11.so.6()(64bit), ...), which every rpm distribution maps to its own package names.
# The dlopen'd list comes from the strings of a Linux build of the binary.
name: tmop
arch: ${NFPM_ARCH}
platform: linux
version: ${NFPM_VERSION}
section: utils
priority: optional
maintainer: tekikaito <noreply@github.com>
description: |
  Task Manager OverPowered: a skinnable system monitor.
  Processor, memory, disk, network, graphics card, running programs, Docker and more.
vendor: tekikaito
homepage: https://tekikaito.github.io/tmop/
license: GPL-3.0-only

contents:
  - src: ${TMOP_BINARY}
    expand: true
    dst: /usr/bin/tmop
    file_info:
      mode: 0755
  - src: ${TMOP_ROOT}/packaging/linux/tmop.desktop
    expand: true
    dst: /usr/share/applications/tmop.desktop
    file_info:
      mode: 0644
  - src: ${TMOP_ROOT}/assets/icon/tmop-64.png
    expand: true
    dst: /usr/share/icons/hicolor/64x64/apps/tmop.png
    file_info:
      mode: 0644
  - src: ${TMOP_ROOT}/assets/icon/tmop-256.png
    expand: true
    dst: /usr/share/icons/hicolor/256x256/apps/tmop.png
    file_info:
      mode: 0644
  - src: ${TMOP_ROOT}/assets/icon/tmop-512.png
    expand: true
    dst: /usr/share/icons/hicolor/512x512/apps/tmop.png
    file_info:
      mode: 0644
  - src: ${TMOP_ROOT}/assets/icon/tmop-1024.png
    expand: true
    dst: /usr/share/icons/hicolor/1024x1024/apps/tmop.png
    file_info:
      mode: 0644
  - src: ${TMOP_ROOT}/LICENSE
    expand: true
    dst: /usr/share/doc/tmop/LICENSE
    file_info:
      mode: 0644
  - src: ${TMOP_ROOT}/README.md
    expand: true
    dst: /usr/share/doc/tmop/README.md
    file_info:
      mode: 0644
  - src: ${TMOP_ROOT}/assets/fonts/Michroma-OFL.txt
    expand: true
    dst: /usr/share/doc/tmop/Michroma-OFL.txt
    file_info:
      mode: 0644

overrides:
  deb:
    depends:
      - libc6 (>= 2.35)
      - libgcc-s1
      - libegl1
      - libgl1
      - libx11-6
      - libx11-xcb1
      - libxcb1
      - libxcursor1
      - libxi6
      - libxrender1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libwayland-client0
      - libwayland-egl1
    recommends:
      # rfd's file dialogs talk to the desktop portal over libdbus.
      - libdbus-1-3
      - xdg-desktop-portal
  rpm:
    depends:
      - libc.so.6(GLIBC_2.35)(64bit)
      - libgcc_s.so.1()(64bit)
      - libEGL.so.1()(64bit)
      - libGL.so.1()(64bit)
      - libX11.so.6()(64bit)
      - libX11-xcb.so.1()(64bit)
      - libxcb.so.1()(64bit)
      - libXcursor.so.1()(64bit)
      - libXi.so.6()(64bit)
      - libXrender.so.1()(64bit)
      - libxkbcommon.so.0()(64bit)
      - libxkbcommon-x11.so.0()(64bit)
      - libwayland-client.so.0()(64bit)
      - libwayland-egl.so.1()(64bit)
    recommends:
      - libdbus-1.so.3()(64bit)
